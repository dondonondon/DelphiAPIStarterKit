; Optional: set DELPHI_API_CONFIG to an absolute path to this file.
; Default lookup: executable directory, then startup working directory.
; Settings and HMAC secret changes require a server restart.
[Security]
HMACSecret=change-this-to-a-long-random-secret

[Database]
Server=localhost
Database=demo_delphirest
User_Name=root
Password=
CharacterSet=utf8mb4
POOL_MaximumItems=50
POOL_ExpireTimeout=300000
; Optional native client overrides; use absolute deployment paths.
; VendorHome=C:\MyApp
; VendorLib=/usr/lib/x86_64-linux-gnu/libmysqlclient.so.21
; Environment overrides: DELPHI_API_DB_VENDOR_HOME, DELPHI_API_DB_VENDOR_LIB

[HTTP]
; Compress eligible JSON responses only when the client accepts gzip.
GzipEnabled=True
; Uncompressed UTF-8 body size in bytes; 1024 bytes = 1 KiB.
GzipMinimumBytes=1024
; 1..9: 1 favors speed/low CPU; 9 favors smaller output/more CPU.
GzipLevel=1
