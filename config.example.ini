[HTTP]
Port=9000
AllowedOrigins=

[Security]
Profile=password-only
Argon2Library=
Argon2SHA256=
LegacyHashDeadline=0
HMACSecret=
PasswordBlocklist=
AccessSeconds=900
AbsoluteSeconds=604800
IdleSeconds=86400
RecoverySeconds=900
RecentSeconds=300
AccountLimit=10
OriginLimit=60
GlobalLimit=300
AdmissionLimit=4

[Database]
Server=127.0.0.1
Port=3306
Database=demo_delphirest
User_Name=configure-a-dedicated-user
Password=
CharacterSet=utf8mb4
VendorLib=
LoginTimeout=5
POOL_MaximumItems=50
POOL_ExpireTimeout=300000

[Logging]
Root=logs
ErrorFile=
MaxBytes=10485760
RetainedFiles=5
